name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The live suites need testnut.cashu.space, a public test mint that is sometimes slow or reset.
  # They run only when started by hand, so a testnut outage never fails a pull request.
  workflow_dispatch:
    inputs:
      live:
        description: Also run the live testnut suites (library and demo)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: examples/demo-worker
      # Unit tests: Workers vitest pool with a local D1, no network.
      - run: npm test

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Test sats only: testnut's Lightning is fake.
      - run: npm run test:testnut
      - run: npm test
        working-directory: examples/demo-worker
